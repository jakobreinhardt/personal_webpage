services:
  - type: web
    name: personal-webpage-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: cron
    name: daily-mountain-weather
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 6,18 * * *"
    startCommand: python weather_service.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
